<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Confirmed — Forma</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0A0A0A;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{max-width:400px;width:100%;text-align:center;}
    .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:40px;}
    .bolt{width:32px;height:32px;}
    .logo-text{font-size:28px;font-weight:800;letter-spacing:-0.5px;}
    .icon-wrap{width:80px;height:80px;background:#00C85318;border:1px solid #00C85340;border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px;}
    h1{font-size:28px;font-weight:800;margin-bottom:12px;letter-spacing:-0.5px;}
    p{font-size:16px;color:#aaa;line-height:1.6;margin-bottom:32px;}
    .badge{display:inline-block;background:#00C85318;color:#00C853;border:1px solid #00C85340;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;margin-bottom:32px;}
    .btn{display:block;background:#00C853;color:#002d10;font-weight:800;font-size:16px;padding:16px 32px;border-radius:14px;text-decoration:none;letter-spacing:0.02em;}
    .hint{font-size:13px;color:#444;margin-top:20px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg class="bolt" viewBox="0 0 14 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8.5 1L2 9.5h4.5L2 17l10-9H8L8.5 1z" fill="#00C853"/>
      </svg>
      <span class="logo-text">forma</span>
    </div>

    <div class="icon-wrap">✓</div>
    <h1>Email Confirmed</h1>
    <p>Your account is active. Open the Forma app on your iPhone and sign in to start your program.</p>

    <div class="badge">✓ Account verified</div>

    <a href="https://apps.apple.com/app/forma-gym-lift-tracker/id6765539587" class="btn">
      Open Forma on iPhone →
    </a>

    <p class="hint">Don't have the app yet? Tap the button above to download it free.</p>
  </div>
</body>
</html>
